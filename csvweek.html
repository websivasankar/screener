<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enhanced CSV Viewer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    padding: 20px;
    min-height: 100vh;
}

.container {
    max-width: 1600px;
    margin: 0 auto;
    background: white;
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    overflow: hidden;
}

.header {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    padding: 30px;
}

.header h1 { font-size: 28px; margin-bottom: 10px; }
.header .stats { font-size: 14px; opacity: 0.9; }

.controls {
    padding: 20px 30px;
    background: #f8f9fa;
    border-bottom: 1px solid #e0e0e0;
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
    align-items: center;
}

.search-box {
    flex: 1;
    min-width: 250px;
    position: relative;
}

.search-box input {
    width: 100%;
    padding: 12px 40px 12px 15px;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    font-size: 14px;
    transition: all 0.3s;
}

.search-box input:focus {
    outline: none;
    border-color: #667eea;
    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
}

.search-icon {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: #999;
}

.btn {
    padding: 12px 20px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.3s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
}

.btn-primary {
    background: #667eea;
    color: white;
}

.btn-primary:hover {
    background: #5568d3;
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
}

.btn-secondary {
    background: white;
    color: #667eea;
    border: 2px solid #667eea;
}

.btn-secondary:hover {
    background: #667eea;
    color: white;
}

.table-wrapper {
    overflow-x: auto;
    max-height: calc(100vh - 300px);
}

table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
}

thead {
    position: sticky;
    top: 0;
    z-index: 10;
}

th {
    background: linear-gradient(180deg, #667eea 0%, #5568d3 100%);
    color: white;
    padding: 15px 12px;
    text-align: left;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    user-select: none;
    position: relative;
    white-space: nowrap;
    border-right: 1px solid rgba(255,255,255,0.1);
}

th:hover {
    background: linear-gradient(180deg, #5568d3 0%, #4557c2 100%);
}

th.sorted-asc::after { content: ' ▲'; font-size: 10px; }
th.sorted-desc::after { content: ' ▼'; font-size: 10px; }

.filter-input {
    width: 100%;
    margin-top: 8px;
    padding: 6px 8px;
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 4px;
    background: rgba(255,255,255,0.9);
    font-size: 12px;
}

.filter-input:focus {
    outline: none;
    border-color: white;
    background: white;
}

tbody tr { transition: background 0.2s; }
tbody tr:nth-child(even) { background: #f8f9fa; }
tbody tr:hover { background: #e3f2fd; }

td {
    padding: 12px;
    border-bottom: 1px solid #e0e0e0;
    font-size: 13px;
    color: #333;
}

.numeric {
    text-align: right;
    font-family: 'Courier New', monospace;
}

.positive { color: #10b981; font-weight: 600; }
.negative { color: #ef4444; font-weight: 600; }

.pagination {
    padding: 20px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #f8f9fa;
    border-top: 1px solid #e0e0e0;
}

.page-info { color: #666; font-size: 14px; }

.page-controls {
    display: flex;
    gap: 10px;
}

.page-btn {
    padding: 8px 16px;
    border: 1px solid #e0e0e0;
    background: white;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.2s;
}

.page-btn:hover:not(:disabled) {
    background: #667eea;
    color: white;
    border-color: #667eea;
}

.page-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.page-btn.active {
    background: #667eea;
    color: white;
    border-color: #667eea;
}

select.rows-per-page {
    padding: 8px 12px;
    border: 1px solid #e0e0e0;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
}

.modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.5);
    z-index: 1000;
    align-items: center;
    justify-content: center;
}

.modal.active { display: flex; }

.modal-content {
    background: white;
    padding: 30px;
    border-radius: 12px;
    max-width: 500px;
    width: 90%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}

.modal-content h2 {
    margin-bottom: 20px;
    color: #333;
}

.modal-content button { margin-top: 20px; }

.column-selector {
    max-height: 300px;
    overflow-y: auto;
    margin: 20px 0;
}

.column-item {
    padding: 10px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.column-item input[type="checkbox"] { cursor: pointer; }

@media (max-width: 768px) {
    .controls { flex-direction: column; }
    .search-box { width: 100%; }
}
</style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="stats">
            <span id="total-rows">0</span> total rows | 
            <span id="filtered-rows">0</span> displayed
        </div>
    </div>

    <div class="controls">
        <div class="search-box">
            <input type="text" id="global-search" placeholder="Search across all columns...">
            <span class="search-icon">🔍</span>
        </div>
        
        <button class="btn btn-primary" onclick="clearFilters()">🔄 Clear Filters</button>
        <button class="btn btn-secondary" onclick="showColumnSelector()">⚙️ Columns</button>
        <button class="btn btn-secondary" onclick="exportToCSV()">💾 Export CSV</button>
        <button class="btn btn-secondary" onclick="exportToJSON()">📄 Export JSON</button>
    </div>

    <div class="table-wrapper">
        <table id="data-table">
            <thead id="table-head"></thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>

    <div class="pagination">
        <div class="page-info">
            Showing <span id="showing-start">0</span> to <span id="showing-end">0</span> of <span id="showing-total">0</span> rows
        </div>
        <div class="page-controls">
            <select class="rows-per-page" id="rows-per-page" onchange="changeRowsPerPage()">
                <option value="25">25 per page</option>
                <option value="50" selected>50 per page</option>
                <option value="100">100 per page</option>
                <option value="200">200 per page</option>
                <option value="-1">Show all</option>
            </select>
            <button class="page-btn" onclick="goToPage(currentPage - 1)" id="prev-btn">← Prev</button>
            <span id="page-numbers"></span>
            <button class="page-btn" onclick="goToPage(currentPage + 1)" id="next-btn">Next →</button>
        </div>
    </div>
</div>

<div class="modal" id="column-modal">
    <div class="modal-content">
        <h2>Show/Hide Columns</h2>
        <div class="column-selector" id="column-selector"></div>
        <button class="btn btn-primary" onclick="closeColumnSelector()">Done</button>
    </div>
</div>

`;

let headers = [];
let originalData = [];
let filteredData = [];
let displayData = [];
let sortColumn = null;
let sortDirection = 'asc';
let currentPage = 1;
let rowsPerPage = 200;
let columnFilters = {};
let hiddenColumns = new Set();

const numericColumns = ['STRIKE_PR', 'CLOSE_PRIC', 'UNDRLNG_ST', 'OI_NO_CON', 'CLOSE_PRIC_prev', 
                        'UNDRLNG_ST_prev', 'OI_NO_CON_prev', 'Range1', 'Range2', 'OI_CHANGE', 
                        'CHG_IN_OI', 'NOTIONAL_VALUE'];

parseCSV(CSV_TEXT);

function parseCSV(text) {
    const rows = text.trim().split("\n").map(r => r.split(","));
    headers = rows[0];
    originalData = rows.slice(1).map(r => {
        let obj = {};
        headers.forEach((h, i) => { obj[h] = r[i] || ''; });
        return obj;
    });
    filteredData = [...originalData];
    displayData = [...originalData];
    updateStats();
    renderTable();
    renderPagination();
}

function renderTable() {
    renderHeaders();
    renderBody();
}

function renderHeaders() {
    let html = '<tr>';
    headers.forEach(h => {
        if (hiddenColumns.has(h)) return;
        const sortClass = sortColumn === h ? `sorted-${sortDirection}` : '';
        html += `<th class="${sortClass}" onclick="sortByColumn('${h}')">
                    <div>${h}</div>
                    <input type="text" class="filter-input" placeholder="Filter..." 
                           onclick="event.stopPropagation()" oninput="filterColumn('${h}', this.value)">
                 </th>`;
    });
    html += '</tr>';
    document.getElementById('table-head').innerHTML = html;
}

function renderBody() {
    const start = (currentPage - 1) * rowsPerPage;
    const end = rowsPerPage === -1 ? displayData.length : start + rowsPerPage;
    const pageData = displayData.slice(start, end);
    
    let html = '';
    pageData.forEach(row => {
        html += '<tr>';
        headers.forEach(h => {
            if (hiddenColumns.has(h)) return;
            const value = row[h];
            const isNumeric = numericColumns.includes(h);
            let className = isNumeric ? 'numeric' : '';
            if (h === 'CHG_IN_OI' || h === 'OI_CHANGE') {
                const num = parseFloat(value);
                if (num > 0) className += ' positive';
                else if (num < 0) className += ' negative';
            }
            html += `<td class="${className}">${formatValue(h, value)}</td>`;
        });
        html += '</tr>';
    });
    
    document.getElementById('table-body').innerHTML = html || '<tr><td colspan="100" style="text-align:center;padding:40px;">No data to display</td></tr>';
    updatePaginationInfo();
}

function formatValue(header, value) {
    if (!value) return '-';
    if (numericColumns.includes(header)) {
        const num = parseFloat(value);
        if (isNaN(num)) return value;
        if (Math.abs(num) >= 1000000) return (num / 1000000).toFixed(2) + 'M';
        else if (Math.abs(num) >= 1000) return (num / 1000).toFixed(2) + 'K';
        else return num.toFixed(2);
    }
    return value;
}

function sortByColumn(column) {
    if (sortColumn === column) {
        sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
    } else {
        sortColumn = column;
        sortDirection = 'asc';
    }
    displayData.sort((a, b) => {
        let aVal = a[column];
        let bVal = b[column];
        if (!aVal) return 1;
        if (!bVal) return -1;
        if (numericColumns.includes(column)) {
            aVal = parseFloat(aVal) || 0;
            bVal = parseFloat(bVal) || 0;
        }
        if (sortDirection === 'asc') {
            return aVal > bVal ? 1 : -1;
        } else {
            return aVal < bVal ? 1 : -1;
        }
    });
    renderTable();
}

function filterColumn(column, value) {
    columnFilters[column] = value.toLowerCase();
    applyFilters();
}

function applyFilters() {
    filteredData = originalData.filter(row => {
        return Object.keys(columnFilters).every(col => {
            const filterValue = columnFilters[col];
            if (!filterValue) return true;
            const cellValue = String(row[col]).toLowerCase();
            return cellValue.includes(filterValue);
        });
    });
    const globalSearch = document.getElementById('global-search').value.toLowerCase();
    if (globalSearch) {
        filteredData = filteredData.filter(row => {
            return headers.some(h => String(row[h]).toLowerCase().includes(globalSearch));
        });
    }
    displayData = [...filteredData];
    currentPage = 1;
    updateStats();
    renderTable();
    renderPagination();
}

function clearFilters() {
    columnFilters = {};
    document.getElementById('global-search').value = '';
    document.querySelectorAll('.filter-input').forEach(input => input.value = '');
    applyFilters();
}

function updateStats() {
    document.getElementById('total-rows').textContent = originalData.length.toLocaleString();
    document.getElementById('filtered-rows').textContent = filteredData.length.toLocaleString();
}

function renderPagination() {
    const totalPages = rowsPerPage === -1 ? 1 : Math.ceil(displayData.length / rowsPerPage);
    document.getElementById('prev-btn').disabled = currentPage === 1;
    document.getElementById('next-btn').disabled = currentPage === totalPages || totalPages === 0;
    let pageNumbers = '';
    const maxButtons = 5;
    let startPage = Math.max(1, currentPage - Math.floor(maxButtons / 2));
    let endPage = Math.min(totalPages, startPage + maxButtons - 1);
    if (endPage - startPage < maxButtons - 1) {
        startPage = Math.max(1, endPage - maxButtons + 1);
    }
    for (let i = startPage; i <= endPage; i++) {
        const activeClass = i === currentPage ? 'active' : '';
        pageNumbers += `<button class="page-btn ${activeClass}" onclick="goToPage(${i})">${i}</button>`;
    }
    document.getElementById('page-numbers').innerHTML = pageNumbers;
}

function updatePaginationInfo() {
    const start = rowsPerPage === -1 ? 1 : (currentPage - 1) * rowsPerPage + 1;
    const end = rowsPerPage === -1 ? displayData.length : Math.min(currentPage * rowsPerPage, displayData.length);
    const total = displayData.length;
    document.getElementById('showing-start').textContent = total === 0 ? 0 : start;
    document.getElementById('showing-end').textContent = end;
    document.getElementById('showing-total').textContent = total;
}

function goToPage(page) {
    const totalPages = rowsPerPage === -1 ? 1 : Math.ceil(displayData.length / rowsPerPage);
    if (page >= 1 && page <= totalPages) {
        currentPage = page;
        renderBody();
        renderPagination();
        document.querySelector('.table-wrapper').scrollTop = 0;
    }
}

function changeRowsPerPage() {
    rowsPerPage = parseInt(document.getElementById('rows-per-page').value);
    currentPage = 1;
    renderBody();
    renderPagination();
}

function showColumnSelector() {
    const modal = document.getElementById('column-modal');
    const selector = document.getElementById('column-selector');
    let html = '';
    headers.forEach(h => {
        const checked = !hiddenColumns.has(h) ? 'checked' : '';
        html += `<div class="column-item">
                    <input type="checkbox" id="col-${h}" ${checked} onchange="toggleColumn('${h}', this.checked)">
                    <label for="col-${h}">${h}</label>
                 </div>`;
    });
    selector.innerHTML = html;
    modal.classList.add('active');
}

function closeColumnSelector() {
    document.getElementById('column-modal').classList.remove('active');
}

function toggleColumn(column, show) {
    if (show) {
        hiddenColumns.delete(column);
    } else {
        hiddenColumns.add(column);
    }
    renderTable();
}

function exportToCSV() {
    let csv = headers.filter(h => !hiddenColumns.has(h)).join(',') + '\n';
    displayData.forEach(row => {
        const values = headers.filter(h => !hiddenColumns.has(h)).map(h => {
            const value = row[h];
            if (value.includes(',') || value.includes('"')) {
                return '"' + value.replace(/"/g, '""') + '"';
            }
            return value;
        });
        csv += values.join(',') + '\n';
    });
    downloadFile(csv, 'export.csv', 'text/csv');
}

function exportToJSON() {
    const json = JSON.stringify(displayData, null, 2);
    downloadFile(json, 'export.json', 'application/json');
}

function downloadFile(content, filename, contentType) {
    const blob = new Blob([content], { type: contentType });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
}

let searchTimeout;
document.getElementById('global-search').addEventListener('input', function() {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => { applyFilters(); }, 300);
});

document.getElementById('column-modal').addEventListener('click', function(e) {
    if (e.target === this) closeColumnSelector();
});

document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeColumnSelector();
    if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
        e.preventDefault();
        document.getElementById('global-search').focus();
    }
});
</script>
